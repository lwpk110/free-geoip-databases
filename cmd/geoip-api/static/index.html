<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoIP 查询服务</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; margin:0; background:#f3f5fb; color:#1f2937; }
    .wrap { max-width: 980px; margin: 24px auto; padding: 0 16px; }
    .card { background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 14px rgba(0,0,0,.06); }
    h1,h2 { margin:0 0 12px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    input,textarea { width:100%; border:1px solid #d1d5db; border-radius:8px; padding:10px; font-size:14px; }
    button { border:none; background:#2563eb; color:#fff; border-radius:8px; padding:10px 14px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    pre { background:#111827; color:#e5e7eb; border-radius:8px; padding:12px; overflow:auto; font-size:12px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
    .kpi { background:#f8fafc; border-radius:8px; padding:10px; }
    .muted { color:#6b7280; font-size:12px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🌍 GeoIP 查询服务</h1>
    <div class="muted">支持多数据库回退、热更新、批量查询、缓存与可观测性</div>
  </div>

  <div class="card">
    <h2>单个 IP 查询</h2>
    <div class="row">
      <input id="ipInput" placeholder="例如 8.8.8.8" />
      <button onclick="lookupIP()">查询</button>
    </div>
    <pre id="singleResult"></pre>
  </div>

  <div class="card">
    <h2>批量查询</h2>
    <textarea id="batchInput" rows="4" placeholder="每行一个 IP，例如:\n8.8.8.8\n1.1.1.1"></textarea>
    <div style="margin-top:8px"><button onclick="batchLookup()">批量查询</button></div>
    <pre id="batchResult"></pre>
  </div>

  <div class="card">
    <h2>系统观测</h2>
    <div class="grid" id="metrics"></div>
    <pre id="statusResult"></pre>
  </div>
</div>

<script>
function pretty(el, obj){ document.getElementById(el).textContent = JSON.stringify(obj, null, 2); }
async function lookupIP(){
  const ip = document.getElementById('ipInput').value.trim();
  if(!ip) return;
  const r = await fetch(`/api/v1/lookup/${encodeURIComponent(ip)}`);
  pretty('singleResult', await r.json());
}
async function batchLookup(){
  const ips = document.getElementById('batchInput').value.split(/\s+/).map(v=>v.trim()).filter(Boolean);
  if(!ips.length) return;
  const r = await fetch('/api/v1/lookup/batch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ips})});
  pretty('batchResult', await r.json());
}
async function loadStatusAndMetrics(){
  const [sr, mr] = await Promise.all([fetch('/api/v1/status'), fetch('/api/v1/metrics')]);
  const status = await sr.json();
  const metrics = await mr.json();
  pretty('statusResult', status);
  const box = document.getElementById('metrics');
  box.innerHTML = [
    ['状态', status.status],
    ['数据库数量', (status.databases||[]).length],
    ['总查询', metrics.total_lookups],
    ['批量请求', metrics.batch_requests],
    ['缓存命中率', metrics.cache_hit_rate],
    ['限流次数', metrics.rate_limited],
    ['鉴权拒绝', metrics.auth_rejected],
    ['热更新次数', metrics.hot_reloads]
  ].map(([k,v])=>`<div class="kpi"><div class="muted">${k}</div><div>${v ?? '-'}</div></div>`).join('');
}
loadStatusAndMetrics();
setInterval(loadStatusAndMetrics, 15000);
</script>
</body>
</html>
